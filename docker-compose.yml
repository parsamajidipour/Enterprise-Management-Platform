services:
  proxy:
    image: nginx:1.27-alpine
    container_name: emp_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - emp_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: emp_frontend
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: /api
      HOST: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - emp_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emp_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - backend_storage_public:/var/www/html/storage/app/public
      - backend_storage_logs:/var/www/html/storage/logs
    expose:
      - "8000"
    environment:
      APP_NAME: Enterprise Management Platform
      APP_ENV: production
      APP_KEY: ${APP_KEY:?set APP_KEY in your .env, e.g. via `php artisan key:generate --show`}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-emp_platform}
      DB_USERNAME: ${DB_USERNAME:-emp}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      LOG_CHANNEL: stack
      CACHE_DRIVER: file
      FILESYSTEM_DISK: public
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - emp_network

  mysql:
    image: mysql:8
    container_name: emp_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-emp_platform}
      MYSQL_USER: ${DB_USERNAME:-emp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emp_network

  adminer:
    image: adminer:latest
    container_name: emp_adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      - mysql
    networks:
      - emp_network

volumes:
  mysql_data:
    driver: local
  backend_storage_public:
    driver: local
  backend_storage_logs:
    driver: local

networks:
  emp_network:
    driver: bridge
